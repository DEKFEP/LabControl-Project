<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Estado actual y agenda de reservas de los laboratorios del Liceo INSUCO." />
<meta property="og:title" content="Disponibilidad · LabControl" />
<meta property="og:description" content="Estado actual y agenda de reservas de los laboratorios del Liceo INSUCO." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://labcontrol-ym.pages.dev/disponibilidad" />
<link rel="canonical" href="https://labcontrol-ym.pages.dev/disponibilidad" />
<meta name="theme-color" content="#059669" />
<link rel="icon" type="image/png" href="img/labcontrol-icon.png" />
<link rel="apple-touch-icon" href="img/labcontrol-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Disponibilidad · LabControl</title>
<link rel="stylesheet" href="css/style.css?v=4.9" />
<link rel="stylesheet" href="css/operaciones.css?v=3" />
<script src="js/theme.js?v=4.9"></script>
</head>
<body>
<a class="skip-nav" href="#main-content">Saltar al contenido</a>
<header class="app-brand"><a href="index" aria-label="LabControl, inicio"><img class="app-brand__icon" src="img/labcontrol-icon.png" alt="" width="32" height="32" />LabControl</a></header>
<div class="app-layout">

  <aside class="sidebar">
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">--</div>
      <div>
        <div class="name">Cargando…</div>
        <div class="role">—</div>
      </div>
    </div>
  </aside>

  <main class="main-content operaciones" id="main-content" role="main" tabindex="-1">
    <header class="page-header"><div><p class="fecha-cabecera"><i data-lucide="calendar-days" aria-hidden="true"></i><span id="fecha-hoy"></span></p><h1>Disponibilidad</h1></div>
      <button class="btn btn--primary" id="btn-nueva-reserva"><i data-lucide="plus" aria-hidden="true"></i>Nueva reserva</button>
    </header>
    <dl class="indicadores" id="disp-stats"><div><dt class="stat-card__label">Laboratorios</dt><dd class="stat-card__value" id="total">—</dd></div><div><dt class="stat-card__label">Disponibles</dt><dd class="stat-card__value" id="disponibles">—</dd></div><div><dt class="stat-card__label">Reservas hoy</dt><dd class="stat-card__value" id="reservas-hoy">—</dd></div></dl>
    <section><div class="titulo-estado"><h2>Estado actual</h2><span id="cuenta-labs"></span></div>
      <div id="tarjetas-disponibilidad"></div>
      <div class="table-wrap estado-tabla">
        <table>
          <thead>
            <tr>
              <th>Laboratorio</th>
              <th>Sala</th>
              <th>Equipos</th>
              <th>Estado</th>
              <th>Horario</th>
              <th>Responsable</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-disponibilidad"></tbody>
        </table>
      </div>
    </section>
    <section><h2>Reservas</h2>
      <div class="filtros agenda-controles">
        <div class="segmentos" role="group" aria-label="Vista de reservas"><button class="btn" data-modo="dia" aria-pressed="true">Día</button><button class="btn" data-modo="semana" aria-pressed="false">Semana</button></div>
        <label>Elegir fecha<input class="form-input" type="date" id="fecha-agenda" /></label>
        <button class="btn" id="hoy">Hoy</button>
      </div>
      <div id="nav-semana" hidden>
        <div class="semana-nav">
          <button type="button" class="btn btn--sm" data-semanas="-1">Semana anterior</button>
          <span class="semana-label" id="semana-label" aria-live="polite"></span>
          <button type="button" class="btn btn--sm" data-semanas="1">Semana siguiente</button>
        </div>
      </div>
      <div id="agenda"></div>
    </section>
  </main>
</div>

<div class="modal-overlay operaciones" id="modal-estado" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-estado-titulo">
  <div class="modal">
    <div class="modal__header">
      <span class="modal__title" id="modal-estado-titulo">Cambiar estado del laboratorio</span>
      <button aria-label="Cerrar" class="modal__close" id="btn-cerrar-estado"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body">
      <p id="modal-estado-lab" style="font-weight:600;margin-bottom:12px"></p>
      <div class="form-group">
        <label class="form-label" for="select-nuevo-estado">Nuevo estado</label>
        <select class="form-input" id="select-nuevo-estado">
          <option value="disponible">Disponible</option>
          <option value="ocupado">Ocupado</option>
          <option value="mantencion">Mantención</option>
        </select>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn" id="btn-cancelar-estado">Cancelar</button>
      <button class="btn btn--primary" id="btn-guardar-estado">Guardar cambio</button>
    </div>
  </div>
</div>

<div class="modal-overlay operaciones" id="modal-reserva" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-reserva-titulo">
  <form class="modal" id="form-reserva" novalidate>
    <div class="modal__header">
      <span class="modal__title" id="modal-reserva-titulo">Nueva reserva</span>
      <button type="button" aria-label="Cerrar" class="modal__close" id="btn-cerrar-reserva"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body">
      <div class="form-group">
        <label class="form-label" for="res-lab">Laboratorio</label>
        <select class="form-input" id="res-lab"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="res-fecha">Fecha</label>
          <input class="form-input" type="date" id="res-fecha" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="res-inicio">Hora inicio</label>
          <input class="form-input" type="time" id="res-inicio" value="08:00" />
        </div>
        <div class="form-group">
          <label class="form-label" for="res-fin">Hora fin</label>
          <input class="form-input" type="time" id="res-fin" value="10:00" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="res-motivo">Actividad</label>
        <input class="form-input" type="text" id="res-motivo" placeholder="Ej: Clase de Estadística aplicada" required minlength="3" />
      </div>
    </div>
    <p id="res-error" role="alert"></p>
    <div class="modal__footer">
      <button type="button" class="btn" id="btn-cancelar-reserva">Cancelar</button>
      <button class="btn btn--primary" type="submit" id="btn-guardar-reserva">Confirmar reserva</button>
    </div>
  </form>
</div>

<script type="module" src="js/data.js?v=4.9"></script>
<script src="js/vendor/lucide.min.js?v=4.9"></script>
<script type="module" src="js/app.js?v=4.9"></script>
<script type="module" src="js/disponibilidad.js?v=4.9"></script>
</body>
</html>
