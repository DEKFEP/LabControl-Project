name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Calidad (test · lint · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/config/package-lock.json
      - name: Instalar dependencias de calidad (config)
        working-directory: website/config
        run: npm ci
      - name: Instalar dependencias de runtime (backend)
        working-directory: website/backend
        run: npm ci
      - name: Tests de backend (Jest + Supertest)
        working-directory: website/config
        run: npm test
      - name: Lint (ESLint)
        working-directory: website/config
        run: npm run lint
      - name: Typecheck (TypeScript)
        working-directory: website/config
        run: npm run typecheck
      - name: Sintaxis (node --check)
        working-directory: website/config
        run: npm run check

  audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/config/package-lock.json
      - name: Instalar dependencias de calidad (config)
        working-directory: website/config
        run: npm ci
      # Grado "high": los moderados (p. ej. la cadena de jest) se ven en el
      # reporte pero no tumban el CI. Solo lo crítico/alto bloquea la rama.
      - name: Auditoría de dependencias de calidad (config)
        working-directory: website/config
        run: npm audit --audit-level=high
      - name: Instalar dependencias de runtime (backend)
        working-directory: website/backend
        run: npm ci
      - name: Auditoría de dependencias de runtime (backend)
        working-directory: website/backend
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/config/package-lock.json
      - name: Instalar dependencias de calidad (config)
        working-directory: website/config
        run: npm ci
      - name: Instalar dependencias de runtime (backend)
        working-directory: website/backend
        run: npm ci
      - name: Instalar navegador Chromium
        working-directory: website/config
        run: npx playwright install --with-deps chromium
      - name: Tests e2e
        working-directory: website/config
        env:
          # Credenciales de prueba fuera del código (ver e2e/smoke.spec.mjs). Si
          # los secretos no existen quedan vacíos y la suite usa las cuentas demo.
          LC_E2E_ADMIN_USER: ${{ vars.LC_E2E_ADMIN_USER }}
          LC_E2E_ADMIN_PASS: ${{ secrets.LC_E2E_ADMIN_PASS }}
          LC_E2E_CAMILA_PASS: ${{ secrets.LC_E2E_CAMILA_PASS }}
          LC_E2E_JUAN_PASS: ${{ secrets.LC_E2E_JUAN_PASS }}
        run: npm run test:e2e